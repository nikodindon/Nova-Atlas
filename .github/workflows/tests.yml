name: Unit tests
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, 'feature/v2-*']
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m playwright install --with-deps chromium --only-shell
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m deploy.secret_scan
      - run: node tests/test_csrf.cjs
      - run: for script in modules/web/assets/*.js; do node --check "$script"; done
      - run: python -m compileall -q main.py modules tests
      - run: python -m pytest -q --junitxml=pytest-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: pytest-results.xml

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-runtime.lock
      - run: python -m pip install -r requirements-runtime.lock
      - run: python -m deploy.smoke
      - run: python -m deploy.rss_smoke
      - run: python -m deploy.tts_lab_smoke
      - run: python -m deploy.radio_studio_smoke
      - run: python -m deploy.field_probe_smoke
      - run: python -m deploy.rc_validation --output /tmp/rc-measurements.json
      - uses: actions/upload-artifact@v4
        with:
          name: rc-synthetic-measurements
          path: /tmp/rc-measurements.json

  gateway-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-runtime.lock
      - run: python -m deploy.gateway_smoke

  database-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-runtime.lock
      - run: python -m deploy.database_smoke

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run audit
      - run: npm run build
      - run: node tests/budget.mjs
      - run: ./node_modules/.bin/playwright install --with-deps chromium --only-shell
      - run: npm run test:browser
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-runtime.lock
        working-directory: .
      - run: python -m deploy.frontend_smoke
        working-directory: .
