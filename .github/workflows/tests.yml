name: Unit tests
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, 'feature/v2-*']
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m playwright install --with-deps chromium --only-shell
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test_csrf.cjs
      - run: for script in modules/web/assets/*.js; do node --check "$script"; done
      - run: python -m compileall -q main.py modules tests
      - run: python -m pytest -q --junitxml=pytest-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: pytest-results.xml

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-runtime.lock
      - run: python -m pip install -r requirements-runtime.lock
      - run: python -m deploy.smoke
      - run: python -m deploy.rss_smoke
      - run: python -m deploy.tts_lab_smoke
      - run: python -m deploy.radio_studio_smoke

  gateway-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-runtime.lock
      - run: python -m deploy.gateway_smoke

  database-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-runtime.lock
      - run: python -m deploy.database_smoke
