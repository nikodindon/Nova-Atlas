worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
 include /etc/nginx/mime.types;
 access_log off;
 server_tokens off;
 client_body_temp_path /tmp/client_body;
 proxy_temp_path /tmp/proxy;
 client_max_body_size 64k;
 upstream flask { server web:5055; }
 upstream svelte { server frontend:3000; }
 server {
  listen 8080;
  # The deployment operator declares the public scheme. Client headers are discarded.
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto ${ATLAS_PUBLIC_SCHEME};
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header Forwarded "";
  proxy_connect_timeout 3s;
  proxy_read_timeout 30s;
  proxy_buffering off;
  location /stream/ { proxy_pass http://flask; proxy_read_timeout 1h; }
  location ~ ^/(api/|admin(?:/|$)|assets/|media/|config(?:/|$)|preferences(?:/|$)|audio(?:/|$)|radio-studio(?:/|$)|editions/|reports/|live(?:\.html|/|$)|index\.html$) { proxy_pass http://flask; }
  location = / { proxy_pass http://svelte; }
  location ~ ^/(direct(?:/|$)|categories(?:/|$)|evenements(?:/|$)|archives(?:/|$)|rapports(?:/|$)|editions-v2(?:/|$)|administration(?:/|$)|connexion$|_app/|healthz$) { proxy_pass http://svelte; }
  # Preserve all remaining historical paths, including dated static HTML exports.
  location / { proxy_pass http://flask; }
 }
}
