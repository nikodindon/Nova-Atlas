services:
  icecast:
    # NOTE: l'image ghcr.io/karlheinzniebuhr/icecast:latest référencée avant
    # n'est plus accessible (registry denied). Remplacée par moul/icecast:latest
    # qui sert HTTP 200 sur /admin/ avec les creds par défaut.
    image: moul/icecast:latest
    container_name: nova-icecast
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ICECAST_SOURCE_PASSWORD=hackme
      - ICECAST_ADMIN_PASSWORD=hackme
      - ICECAST_HOSTNAME=localhost
    networks:
      - nova-net

networks:
  nova-net:
    driver: bridge
